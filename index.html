<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure Horizon | Communications, Creative &amp; Impact</title>
<meta name="description" content="Azure Horizon is a full-service communications and marketing agency: strategy, campaigns, advocacy, PR, resource mobilization, design, film, animation and web.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141416; --ink2:#1b1c20; --ink3:#24262c;
  --paper:#f4f6f9; --white:#ffffff;
  --azure:#3d8bff; --azure-d:#1f6be0; --azure-l:#8cbcff; --band:#6ea6ff;
  --navy:#0a2463;
  --txt:#e8ebf1; --muted:#aeb4c0; --dark-txt:#1b1d22; --dark-muted:#5a6070;
  --max:1120px; --r:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ink);color:var(--txt);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
section{padding:96px 0}
h1,h2,h3,h4{font-weight:600;line-height:1.2;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3vw,2.15rem)}
h3{font-size:1.15rem}
p{color:var(--muted)}
.light p{color:var(--dark-muted)}
.bar{width:64px;height:3px;background:var(--azure);margin:18px 0 30px;border-radius:2px}
.center .bar{margin-left:auto;margin-right:auto}
.center{text-align:center}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.18em;color:var(--azure-l);font-weight:600;margin-bottom:12px;display:block}
.light .eyebrow{color:var(--azure-d)}
.small{font-size:.875rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid currentColor;padding:9px 20px;font-size:.85rem;font-weight:600;letter-spacing:.02em;border-radius:var(--r);transition:.2s;cursor:pointer;background:transparent;color:inherit}
.btn:hover{background:var(--white);color:var(--ink);border-color:var(--white)}
.btn.dark{color:var(--dark-txt)}
.btn.dark:hover{background:var(--dark-txt);color:#fff;border-color:var(--dark-txt)}
.btn.solid{background:var(--azure);border-color:var(--azure);color:#fff}
.btn.solid:hover{background:var(--azure-d);border-color:var(--azure-d);color:#fff}
.arrow{transition:transform .2s}.btn:hover .arrow{transform:translateX(3px)}

/* Header */
header.site{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s,padding .3s;padding:18px 0}
header.site.solid{background:rgba(20,20,22,.96);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(255,255,255,.06);padding:10px 0}
.hd{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:44px;height:44px;flex:none}
.logo .wm{line-height:1}
.logo .wm b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:.06em;color:#fff}
.logo .wm small{display:block;font-size:.56rem;letter-spacing:.32em;font-weight:600;color:#fff;margin-top:4px;opacity:.9}
nav.main{display:flex;align-items:center;gap:30px;font-size:.86rem;font-weight:500}
nav.main>a,nav.main .dd>a{color:#fff;opacity:.9;padding:8px 0;position:relative}
nav.main a:hover{opacity:1;color:var(--azure-l)}
nav.main a.active{color:var(--azure-l);opacity:1}
.dd{position:relative}
.dd>a::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:8px;position:relative;top:-3px}
.dd-menu{position:absolute;top:100%;left:50%;transform:translate(-50%,8px);background:var(--ink2);min-width:290px;padding:12px 0;box-shadow:0 20px 40px rgba(0,0,0,.4);border-top:2px solid var(--azure);opacity:0;visibility:hidden;transition:.2s}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{opacity:1;visibility:visible;transform:translate(-50%,0)}
.dd-menu a{display:block;padding:8px 22px;font-size:.84rem;color:var(--txt)}
.dd-menu a:hover{background:rgba(61,139,255,.12);color:#fff}
.dd-menu .all{border-top:1px solid rgba(255,255,255,.08);margin-top:6px;padding-top:12px;color:var(--azure-l);font-weight:600}
.burger{display:none;background:none;border:0;color:#fff;width:42px;height:42px;cursor:pointer}
.burger span{display:block;width:24px;height:2px;background:#fff;margin:5px auto;transition:.3s}
.mnav{position:fixed;inset:0;background:var(--ink);z-index:60;padding:90px 28px 40px;overflow:auto;transform:translateX(100%);transition:transform .35s ease}
.mnav.open{transform:none}
.mnav a{display:block;font-size:1.35rem;font-weight:600;padding:10px 0;color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
.mnav .sub a{font-size:.95rem;font-weight:400;color:var(--muted);padding:7px 0 7px 14px;border:0}
.mnav .x{position:absolute;top:22px;right:22px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1}

/* Local editorial image assets */
.ph{position:relative;overflow:hidden;background:#1e3a8a}
.ph img{width:100%;height:100%;object-fit:cover}
.ph-art{position:absolute;inset:0;width:100%;height:100%}
.ph-tag{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(10,20,45,.62);color:#fff;font-size:.68rem;font-weight:500;padding:5px 9px;border-radius:20px;backdrop-filter:blur(4px);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.ph-tag svg{width:12px;height:12px;flex:none}

/* Hero */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;padding:0 0 12vh;overflow:hidden}
.hero.inner{min-height:62vh;padding-bottom:9vh}
.hero>.ph{position:absolute;inset:0}
.hero.plain{background:radial-gradient(70% 70% at 80% 52%,rgba(61,139,255,.22) 0%,rgba(61,139,255,0) 65%),linear-gradient(180deg,#0b1430 0%,#0f1424 55%,var(--ink) 100%)}
.hero.plain::after{background:linear-gradient(90deg,rgba(14,17,28,.85) 0%,rgba(14,17,28,.35) 45%,rgba(14,17,28,0) 70%),linear-gradient(180deg,rgba(14,17,28,0) 70%,var(--ink) 100%)}
.geo{position:absolute;inset:0;width:100%;height:100%}
.geo .rays{transform-box:view-box;transform-origin:1150px 470px;animation:geoSpin 120s linear infinite}
.geo .dash{animation:geoDash 30s linear infinite}
.geo .dash2{animation:geoDash 45s linear infinite reverse}
.geo .core{animation:geoGlow 6s ease-in-out infinite}
.geo .float{animation:geoFloat 9s ease-in-out infinite}
.geo .float2{animation:geoFloat 12s ease-in-out infinite reverse}
@keyframes geoSpin{to{transform:rotate(360deg)}}
@keyframes geoDash{to{stroke-dashoffset:-400}}
@keyframes geoGlow{0%,100%{opacity:.9}50%{opacity:.6}}
@keyframes geoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero .wrap>*{animation:heroIn 1s cubic-bezier(.2,.7,.2,1) both}
.hero .wrap>*:nth-child(2){animation-delay:.12s}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:720px){.hero.plain::after{background:linear-gradient(180deg,rgba(14,17,28,.1) 0%,rgba(14,17,28,.55) 55%,rgba(14,17,28,.95) 100%)}}
@media (prefers-reduced-motion:reduce){.geo *,.hero .wrap>*{animation:none!important}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,20,.55) 0%,rgba(10,12,20,.15) 40%,rgba(10,12,20,.75) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.6rem);font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#fff;line-height:1.02}
.hero.inner h1{font-size:clamp(2rem,5vw,3.6rem)}
.hero .lead{color:#dfe6f3;font-size:clamp(1rem,1.6vw,1.15rem);max-width:620px;margin-top:18px}
.hero .crumb{font-size:.78rem;color:var(--azure-l);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:14px;display:block}
.hero .ph-tag{z-index:3;bottom:auto;top:96px;left:auto;right:16px}

/* Layout helpers */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split .ph{aspect-ratio:3/2}
.split p+p{margin-top:16px}
.band{background:var(--band);color:#fff;text-align:center;padding:80px 0}
.band h2{font-weight:600;max-width:760px;margin:0 auto 28px;font-size:clamp(1.4rem,2.6vw,1.9rem)}
.band.navy{background:var(--navy)}
.light{background:var(--paper);color:var(--dark-txt)}
.white{background:#fff;color:var(--dark-txt)}
.bgimg{position:relative;overflow:hidden}
.bgimg>.ph{position:absolute;inset:0;opacity:.13;filter:grayscale(.3)}
.bgimg>.ph .ph-tag{opacity:1}
.bgimg .wrap{position:relative}
.bgimg p{max-width:900px}

/* Cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--paper);color:var(--dark-txt);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:16/7}
.card .body{padding:26px 28px 30px;display:flex;flex-direction:column;flex:1}
.card h3{margin-bottom:10px}
.card p{color:var(--dark-muted);font-size:.86rem;margin-bottom:18px}
.card .links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.card .links a{font-size:.74rem;background:#e4ecf9;color:#16408a;padding:4px 10px;border-radius:20px;font-weight:500}
.card .links a:hover{background:var(--azure);color:#fff}
.card .btn{align-self:flex-start;margin-top:auto}

/* How we work */
.how{display:grid;grid-template-columns:1fr 1.15fr;gap:60px}
.how .item{margin-bottom:38px}
.how .item:last-child{margin-bottom:0}
.how .item h3{font-size:1.25rem;margin-bottom:8px;color:#fff}
.how .item p{font-size:.88rem}

/* Apart */
.apart{display:grid;grid-template-columns:1fr 1fr;min-height:520px}
.apart>.ph{min-height:340px}
.apart .txt{background:#fff;color:var(--dark-txt);padding:80px 70px;display:flex;flex-direction:column;justify-content:center}
.ticks{list-style:none}
.ticks li{position:relative;padding-left:26px;margin-bottom:14px;font-size:.9rem;color:#3b404c}
.ticks li::before{content:"";position:absolute;left:0;top:.45em;width:11px;height:11px;border:1.5px solid var(--azure);border-radius:50%}
.dark .ticks li,.ticks.on-dark li{color:var(--muted)}

/* Industries */
.ind{display:grid;grid-template-columns:1fr 1.2fr;gap:56px;align-items:start}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 20px;text-align:center}
.icons svg{width:38px;height:38px;color:var(--azure-l);margin:0 auto 12px;stroke-width:1.5}
.icons div{font-size:.84rem;color:var(--txt);line-height:1.35}

/* Service list */
.svc-row{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:56px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.svc-row:last-child{border-bottom:0}
.svc-row:nth-child(even) .ph{order:2}
.svc-row .ph{aspect-ratio:16/10}
.svc-row .num{font-size:.8rem;color:var(--azure-l);font-weight:700;letter-spacing:.14em}
.svc-row h3{font-size:1.6rem;margin:8px 0 14px;color:#fff}
.svc-row p{font-size:.92rem;margin-bottom:18px}
.svc-row ul{columns:2;column-gap:24px;margin-bottom:26px}
.svc-row li{break-inside:avoid}
.pillnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.pillnav a{border:1px solid rgba(255,255,255,.18);padding:7px 14px;border-radius:30px;font-size:.8rem;color:var(--txt)}
.pillnav a:hover{border-color:var(--azure);color:#fff;background:rgba(61,139,255,.15)}

/* Detail */
.deliver{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.deliver div{background:#fff;padding:24px;border-left:3px solid var(--azure);font-size:.92rem;font-weight:500;color:var(--dark-txt)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;counter-reset:s}
.steps div{counter-increment:s;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.steps div::before{content:"0" counter(s);display:block;font-size:2.2rem;font-weight:700;color:var(--azure);line-height:1;margin-bottom:14px}
.steps h4{color:#fff;margin-bottom:6px;font-size:1.05rem}
.steps p{font-size:.86rem}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:200px;gap:14px}
.gallery .ph:first-child{grid-row:span 2}

/* About */
.mvv{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mvv div{background:var(--ink2);padding:34px 30px;border-top:3px solid var(--azure)}
.mvv h3{color:#fff;margin-bottom:12px}
.mvv p{font-size:.9rem}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.values h4{font-size:1.05rem;margin-bottom:8px}
.values p{font-size:.86rem}
.values .ic{width:46px;height:46px;border-radius:50%;background:#e4ecf9;color:var(--azure-d);display:grid;place-items:center;margin-bottom:16px;font-weight:700}

/* Work */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.filters button{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--txt);padding:7px 16px;border-radius:30px;font-size:.82rem;cursor:pointer}
.filters button.on{background:var(--azure);border-color:var(--azure);color:#fff}
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.wk{position:relative;cursor:default}
.wk .ph{aspect-ratio:4/3}
.wk .meta{padding:16px 2px 0}
.wk .cat{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--azure-l);font-weight:600}
.wk h3{color:#fff;margin:6px 0 6px;font-size:1.08rem}
.wk p{font-size:.85rem}
.wk.hide{display:none}

/* Insights */
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.post{background:var(--paper);color:var(--dark-txt);display:flex;flex-direction:column}
.post .ph{aspect-ratio:16/10}
.post .body{padding:24px 24px 28px;flex:1;display:flex;flex-direction:column}
.post .cat{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--azure-d);font-weight:700}
.post h3{margin:8px 0 10px;font-size:1.08rem}
.post p{font-size:.86rem;color:var(--dark-muted)}
.post .more{display:none;margin-top:12px}
.post .more p+p{margin-top:10px}
.post.open .more{display:block}
.post .btn{margin-top:20px;align-self:flex-start}
.post.feature{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}
.post.feature .ph{aspect-ratio:auto;min-height:320px}
.post.feature h3{font-size:1.55rem}
.post.feature .body{padding:40px}

/* Contact */
.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:60px}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
form label{display:block;font-size:.8rem;font-weight:600;margin:0 0 6px;color:var(--dark-txt)}
form .f{margin-bottom:18px}
form input,form select,form textarea{width:100%;padding:12px 14px;border:1px solid #cfd6e2;background:#fff;border-radius:var(--r);color:var(--dark-txt);font-size:.92rem}
form input:focus,form select:focus,form textarea:focus{outline:2px solid var(--azure);outline-offset:-1px;border-color:var(--azure)}
form textarea{min-height:140px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{font-weight:500;display:flex;align-items:center;gap:6px;border:1px solid #cfd6e2;padding:6px 12px;border-radius:30px;cursor:pointer;font-size:.8rem;background:#fff}
.checks input{width:auto}
.note{display:none;margin-top:16px;padding:14px 16px;background:#e4ecf9;color:#16408a;font-size:.88rem;border-left:3px solid var(--azure)}
.note.show{display:block}
.cinfo h3{margin-bottom:6px;font-size:1rem}
.cinfo .blk{margin-bottom:26px}
.cinfo p{font-size:.92rem}
.faq details{border-bottom:1px solid rgba(255,255,255,.1);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;color:#fff;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--azure-l);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:10px;font-size:.9rem}

/* Footer */
footer{background:#fff;color:var(--dark-txt);padding:70px 0 26px}
.ft{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:40px}
footer .logo .wm b,footer .logo .wm small{color:var(--dark-txt)}
footer .logo path[stroke="#fff"]{stroke:var(--dark-txt)}
footer h4{font-size:.92rem;margin-bottom:16px}
footer li{list-style:none;margin-bottom:6px;font-size:.82rem;color:#3b404c}
footer li a:hover{color:var(--azure-d)}
footer p{font-size:.82rem;color:#3b404c}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a{width:30px;height:30px;border:1px solid #cfd6e2;border-radius:50%;display:grid;place-items:center;color:#3b404c}
.soc a:hover{background:var(--azure);border-color:var(--azure);color:#fff}
.soc svg{width:14px;height:14px}
.copy{margin-top:56px;padding-top:20px;border-top:1px solid #e6e9ef;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:.76rem;color:#6b7180}

/* Reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.no-io .rv{opacity:1;transform:none}

/* Responsive */
@media (max-width:960px){
  nav.main{display:none}
  .burger{display:block}
  .grid3,.work,.posts,.deliver{grid-template-columns:1fr 1fr}
  .values{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .ft{grid-template-columns:1fr 1fr}
  .apart .txt{padding:60px 40px}
}
@media (max-width:720px){
  section{padding:64px 0}
  .wrap{padding:0 22px}
  .split,.how,.ind,.svc-row,.contact,.apart,.post.feature,.grid2,.mvv{grid-template-columns:1fr;gap:32px}
  .svc-row:nth-child(even) .ph{order:0}
  .svc-row ul{columns:1}
  .grid3,.work,.posts,.deliver,.values{grid-template-columns:1fr}
  .icons{grid-template-columns:repeat(3,1fr);gap:28px 10px}
  .icons svg{width:32px;height:32px}
  .icons div{font-size:.76rem}
  .apart .txt{padding:48px 24px}
  .apart>.ph{min-height:280px}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .gallery .ph:first-child{grid-column:span 2;grid-row:span 1}
  form .row{grid-template-columns:1fr}
  .ft{grid-template-columns:1fr}
  .hero{min-height:84vh}
  .hero.inner{min-height:56vh}
  .post.feature .body{padding:26px}
  .post.feature .ph{min-height:220px}
  .band{padding:60px 0}
}
</style>
</head>
<body>

<header class="site" id="hdr">
  <div class="wrap hd">
    <a href="#home" class="logo" aria-label="Azure Horizon home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cbcff"/><stop offset="1" stop-color="#2f74f0"/></linearGradient></defs>
        <g stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" fill="none">
          <path d="M24 7v6M12 12l4 4M36 12l-4 4M6 24h5M37 24h5M8.5 16.5l4.5 2.2M39.5 16.5L35 18.7"/>
        </g>
        <path d="M13 28a11 11 0 0 1 22 0z" fill="url(#lg)"/>
        <path d="M4 31h40" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M9 36.5c5-2.6 10-2.6 15 0s10 2.6 15 0" stroke="url(#lg)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M15 41.5c3-1.4 6-1.4 9 0s6 1.4 9 0" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/>
      </svg>
      <span class="wm"><b>AZURE HORIZON</b><small>COMMUNICATIONS</small></span>
    </a>
    <nav class="main" id="nav"></nav>
    <button class="burger" id="burger" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>
<div class="mnav" id="mnav" aria-hidden="true"></div>

<main id="app"></main>

<script>
/* ============================================================
   IMAGE SLOTS: local editorial photos keep the site self-contained.
   Swap any src path here to customize the visual system for a new project.

  const n=h(key), t=TONES[n%TONES.length], cx=120+(n%260), cy=150+(n%60);
  return `<div class="ph ${cls}" role="img" aria-label="${im.label}" style="background:linear-gradient(${120+(n%90)}deg,${t[0]} 0%,${t[1]} 58%,${t[2]} 100%)">
  <svg class="ph-art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
   <defs><radialGradient id="g${n}" cx="${cx/400}" cy="${cy/300}" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
   <rect width="400" height="300" fill="url(#g${n})"/>
   <circle cx="${cx}" cy="${cy+40}" r="46" fill="#fff" fill-opacity=".16"/>

  </svg><span class="ph-tag">${CAM}${im.label}</span></div>`;
}

function geo(){
  const cx=1150, cy=470;
  const rays=Array.from({length:72},(_,i)=>{const a=i*5*Math.PI/180;return `<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*1400).toFixed(1)}" y2="${(cy+Math.sin(a)*1400).toFixed(1)}" stroke-opacity="${i%3?0.05:0.11}"/>`}).join('');
  const rings=[[110,.55,''],[160,.32,'2 10','dash'],[220,.22,''],[290,.16,'1 7','dash2'],[370,.12,''],[460,.09,'40 14','dash'],[560,.07,''],[680,.05,'2 12','dash2'],[820,.04,'']]
    .map(([r,o,d,c])=>`<circle cx="${cx}" cy="${cy}" r="${r}" stroke-opacity="${o}" ${d?`stroke-dasharray="${d}" class="${c}"`:''}/>`).join('');
  let hz='';for(let k=1;k<=12;k++){const y=cy+Math.pow(k,1.85)*3.6;hz+=`<line x1="0" y1="${y.toFixed(1)}" x2="1440" y2="${y.toFixed(1)}" stroke-opacity="${(0.04+k*0.008).toFixed(3)}"/>`}
  let vt='';for(let k=-14;k<=14;k++){vt+=`<line x1="${cx}" y1="${cy}" x2="${cx+k*150}" y2="900" stroke-opacity="${k%2?0.05:0.09}"/>`}
  const plus=(x,y,o=.5)=>`<path d="M${x-7} ${y}h14M${x} ${y-7}v14" stroke="#93c0ff" stroke-opacity="${o}" stroke-width="1.4"/>`;
  return `<svg class="geo" viewBox="0 0 1440 900" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <defs>
    <pattern id="gdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#cfe2ff"/></pattern>
    <radialGradient id="gdm" cx="${cx/1440}" cy="${cy/900}" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gdmask"><rect width="1440" height="${cy}" fill="url(#gdm)"/></mask>
    <radialGradient id="gcore"><stop offset="0" stop-color="#e6f0ff"/><stop offset=".45" stop-color="#93c0ff"/><stop offset="1" stop-color="#3d8bff"/></radialGradient>
    <radialGradient id="ghalo"><stop offset="0" stop-color="#6ea6ff" stop-opacity=".45"/><stop offset="1" stop-color="#6ea6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ghz" x1="0" x2="1"><stop offset="0" stop-color="#93c0ff" stop-opacity="0"/><stop offset=".55" stop-color="#93c0ff" stop-opacity=".5"/><stop offset=".8" stop-color="#cfe2ff" stop-opacity=".95"/><stop offset="1" stop-color="#93c0ff" stop-opacity=".4"/></linearGradient>
    <linearGradient id="gfl" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#555"/><stop offset=".75" stop-color="#fff"/></linearGradient>
    <mask id="gleft"><rect width="1440" height="900" fill="url(#gfl)"/></mask>
    <clipPath id="gabove"><rect width="1440" height="${cy}"/></clipPath>
    <clipPath id="gbelow"><rect y="${cy}" width="1440" height="${900-cy}"/></clipPath>
  </defs>
  <rect width="1440" height="${cy}" fill="url(#gdots)" mask="url(#gdmask)"/>
  <g mask="url(#gleft)">
    <g clip-path="url(#gabove)" stroke="#93c0ff" fill="none"><g class="rays">${rays}</g></g>
    <g clip-path="url(#gabove)" stroke="#93c0ff" fill="none" stroke-width="1.2">${rings}</g>
    <g clip-path="url(#gbelow)" stroke="#93c0ff" fill="none">${hz}${vt}</g>
  </g>
  <g clip-path="url(#gabove)">
    <circle cx="${cx}" cy="${cy}" r="260" fill="url(#ghalo)"/>
    <circle class="core" cx="${cx}" cy="${cy}" r="96" fill="url(#gcore)"/>
    <circle cx="${cx}" cy="${cy}" r="96" fill="none" stroke="#e6f0ff" stroke-opacity=".6"/>
  </g>
  <g clip-path="url(#gbelow)" fill="#cfe2ff">
    <rect x="${cx-110}" y="${cy+12}" width="220" height="2.5" rx="1.2" opacity=".35"/>
    <rect x="${cx-70}" y="${cy+26}" width="140" height="2" rx="1" opacity=".25"/>
    <rect x="${cx-40}" y="${cy+42}" width="80" height="1.6" rx=".8" opacity=".18"/>
  </g>
  <rect y="${cy-1}" width="1440" height="2" fill="url(#ghz)"/>
  <g class="float">
    <rect x="${cx-372}" y="${cy-300}" width="34" height="34" fill="none" stroke="#93c0ff" stroke-opacity=".45" transform="rotate(45 ${cx-355} ${cy-283})"/>

    <path d="M${cx-300} ${cy-60}l14 -24l14 24z" fill="none" stroke="#93c0ff" stroke-opacity=".35"/>
  </g>
  </svg>`;
}

/* ---------------- Navigation ---------------- */
const PAGES = {home, about, services, work, insights, contact};
function buildNav(){
  document.getElementById('nav').innerHTML = `
    <a href="#home" data-r="home">Home</a>
    <a href="#about" data-r="about">About</a>
    <div class="dd"><a href="#services" data-r="services">Services</a>
      <div class="dd-menu">${SERVICES.map(s=>`<a href="#${s.id}">${s.name}</a>`).join('')}<a class="all" href="#services">All services →</a></div></div>
    <a href="#work" data-r="work">Work</a>
    <a href="#insights" data-r="insights">Insights</a>
    <a href="#contact" data-r="contact">Contact</a>`;
  document.getElementById('mnav').innerHTML = `<button class="x" id="mx" aria-label="Close menu">×</button>
    <a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a>
    <div class="sub">${SERVICES.map(s=>`<a href="#${s.id}">${s.name}</a>`).join('')}</div>
    <a href="#work">Work</a><a href="#insights">Insights</a><a href="#contact">Contact</a>
    <br><a href="#contact" class="btn solid" style="font-size:.9rem;border:0">Start a project</a>`;
}
function setMenu(open){const m=document.getElementById('mnav');m.classList.toggle('open',open);m.setAttribute('aria-hidden',!open);document.body.style.overflow=open?'hidden':''}

let io;
function observe(){
  if(!('IntersectionObserver' in window)){document.body.classList.add('no-io');return}
  io && io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}

function render(){
  const r = (location.hash||'#home').slice(1);
  const page = PAGES[r] ? PAGES[r]() : SVC[r] ? servicePage(SVC[r]) : home();
  document.getElementById('app').innerHTML = page + footer();
  const top = SVC[r] ? 'services' : (PAGES[r] ? r : 'home');
  document.querySelectorAll('#nav [data-r]').forEach(a=>a.classList.toggle('active',a.dataset.r===top));
  document.title = (SVC[r]?SVC[r].name+' | ':(r&&r!=='home'&&PAGES[r]?r[0].toUpperCase()+r.slice(1)+' | ':''))+'Azure Horizon';
  setMenu(false);
  window.scrollTo({top:0,behavior:'instant'});
  onScroll(); observe();
}
function onScroll(){document.getElementById('hdr').classList.toggle('solid',window.scrollY>40)}

document.addEventListener('click',e=>{
  if(e.target.closest('#burger')) return setMenu(true);
  if(e.target.closest('#mx')) return setMenu(false);
  const f = e.target.closest('.filters button');
  if(f){document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b===f));
    document.querySelectorAll('.wk').forEach(w=>w.classList.toggle('hide',f.dataset.f!=='all'&&w.dataset.c!==f.dataset.f));}
  const t = e.target.closest('[data-toggle]');
  if(t){const p=t.closest('.post');p.classList.toggle('open');t.textContent=p.classList.contains('open')?'Show less':'Read more'}
  const a = e.target.closest('a[href^="#"]');
  if(a && a.getAttribute('href')===location.hash){e.preventDefault();render()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='cform')return;
  e.preventDefault();
  const n=document.getElementById('fnote'), ok=['n','e','m'].every(id=>document.getElementById(id).value.trim());
  const em=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById('e').value);
  n.className='note show';
  n.textContent = !ok ? 'Please fill in your name, email and project details.' : !em ? 'Please enter a valid email address.' :
    'Thanks, your enquiry is ready. This form is a preview and will start sending once it is connected to the live site; until then, please email hello@azurehorizon.com.';
});
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('hashchange',render);
buildNav(); render();
</script>
